<script>

 if('scrollRestoration' in history)history.scrollRestoration='manual';
 // block scrolling without hiding the scrollbar (hiding it would shift the page sideways at the end)
 const keys={32:1,33:1,34:1,35:1,36:1,37:1,38:1,39:1,40:1};
 const block=e=>{if(e.type!=='keydown'||keys[e.keyCode])e.preventDefault();};
 const opts={passive:false};['wheel','touchmove','keydown'].forEach(t=>addEventListener(t,block,opts));
 video.muted=true;video.defaultMuted=true;
 // The last frame of the video is the first screen of the site. While playing, the video fills the
 // screen; at the end it "lands" exactly onto the first screen and the rest of the site appears around it.
 const place=()=>{
  const page=document.getElementById('page'),vw=root.clientWidth||innerWidth,vh=innerHeight;
  let W=Math.min(vw,402),L=(vw-W)/2;
  if(page){const b=page.getBoundingClientRect();if(b.width){W=b.width;L=b.left;}}
  const H=W*16/9;
  const s=vw/vh>0.8?Math.max(1,vh/H):Math.max(vw/W,vh/H);
  intro.style.setProperty('--x',L+'px');intro.style.setProperty('--w',W+'px');intro.style.setProperty('--h',H+'px');
  intro.style.setProperty('--t','translate('+((vw-W*s)/2-L)+'px,'+((vh-H*s)/2)+'px) scale('+s+')');
 };
 place();addEventListener('resize',place);document.addEventListener('DOMContentLoaded',place);addEventListener('load',place);
 let done=false,landing=false,started=false;

 const land=()=>{if(landing||done)return;landing=true;window.scrollTo(0,0);place();intro.classList.add('is-landing');setTimeout(remove,900);};
 const end=()=>{if(landing||done)return;if(hero.complete&&hero.naturalWidth)land();else{hero.onload=hero.onerror=land;setTimeout(land,1500);}};

 video.addEventListener('playing',()=>{started=true;},{once:true});
 intro.addEventListener('click',end);
 const attempt=video.play();if(attempt&&attempt.catch)attempt.catch(remove);
 setTimeout(()=>{if(!started)remove();},3500);
 setTimeout(end,10000);
})();

const page=document.getElementById('page'),canvas=document.getElementById('canvas');
let grow=0;function resize(){let scale=page.clientWidth/402;canvas.style.setProperty('--scale',scale);page.style.height=((7010+grow)*scale)+'px';}new ResizeObserver(resize).observe(page);resize();
/* ===== Анкета гостя: отправка ответов в Google Таблицу =====
   RSVP_ENDPOINT — адрес веб-приложения Google Apps Script (см. apps-script/Code.gs и README). */
const RSVP_ENDPOINT='https://script.google.com/macros/s/AKfycbwSwFqtMwqxiH-K55TLhVBL14j7xHBeu0T3kioXZirqtePXF-fJ0TXkUzGuwuS0eD0TeA/exec';
const form=document.getElementById('guest-form'),result=document.getElementById('result'),family=form.elements.family,submitBtn=form.querySelector('button[type=submit]');
const LINE=20,BASE=30,MAX_LINES=6;
function fitFamily(){family.style.height=BASE+'px';const full=family.scrollHeight,h=Math.min(full,BASE+LINE*(MAX_LINES-1));family.style.height=h+'px';family.style.overflowY=full>h?'auto':'hidden';const g=h-BASE;if(g!==grow){grow=g;canvas.style.setProperty('--grow',g+'px');resize();}}
family.addEventListener('input',fitFamily);
form.elements.name.addEventListener('input',()=>form.elements.name.setCustomValidity(''));
function showResult(text){result.textContent=text;result.hidden=false;}
let sending=false;
form.addEventListener('submit',async event=>{
 event.preventDefault();if(sending)return;
 const name=form.elements.name.value.trim();
 if(!name){form.elements.name.setCustomValidity('Укажите имя и фамилию');form.elements.name.reportValidity();return;}
 if(!form.reportValidity())return;
 const payload={name,attendance:form.elements.attendance.value,family:family.value.trim().replace(/\n{2,}/g,'\n'),sentAt:new Date().toISOString()};
 sending=true;submitBtn.disabled=true;const label=submitBtn.textContent;submitBtn.textContent='Отправляем…';result.hidden=true;
 try{
  if(!RSVP_ENDPOINT||RSVP_ENDPOINT.startsWith('__'))throw new Error('endpoint');
  const response=await fetch(RSVP_ENDPOINT,{method:'POST',body:JSON.stringify(payload)});
  const answer=await response.json();
  if(!answer||!answer.ok)throw new Error(answer&&answer.error||'server');
  form.reset();fitFamily();
  showResult(payload.attendance==='Нет'?'Спасибо, что сообщили! Ваш ответ получен.':'Спасибо! Ваш ответ получен — ждём вас на свадьбе.');
 }catch(error){
  console.error('RSVP error',error);
  showResult('Не удалось отправить ответ. Проверьте интернет и попробуйте ещё раз.');
 }finally{sending=false;submitBtn.disabled=false;submitBtn.textContent=label;}
});
</script><script id="wedding-motion-script">(()=>{
 const preference=matchMedia('(prefers-reduced-motion: reduce)');

 const targets=[],photos=[],active=new Set(),sentinels=new Map();let raf=0,stopped=false;
 const add=(id,effect,delay=0)=>{const node=document.querySelector('[data-node-id="'+id+'"]');if(!node)return;node.classList.add('motion-item',effect);node.style.setProperty('--reveal-delay',delay+'ms');targets.push(node);return node;};
 add('6:73','rise');add('6:88','fade-only',100);

 add('6:84','title-sweep');add('6:87','location-photo',120);add('6:85','rise',180);add('6:86','tracking-in',280);
 add('6:10','rise');
 for(const [id,effect,delay] of [

  ['6:24','slide-right',0],['6:36','illustration-right',160],
  ['6:37','illustration-left',0],['6:18','slide-left',160],
  ['6:30','slide-right',0],['6:38','illustration-right',160]
 ])add(id,effect,delay);
 add('6:40','title-sweep');add('6:41','rise',80);add('6:42','rise',140);
 add('6:43','card-left');add('6:44','card-center',140);add('6:45','card-right',260);
 add('6:4','rise');add('6:67','title-sweep',80);add('6:68','rise',150);add('6:70','rise');
 for(const [id,effect,direction] of [['6:7','photo-curtain','vertical'],['6:46','photo-diagonal','horizontal'],['6:69','photo-aperture','vertical']]){
  const node=add(id,effect);if(node){node.classList.add('scroll-photo');photos.push({node,direction});}

 },{threshold:0,rootMargin:'0px 0px -45px 0px'});
 const draw=()=>{raf=0;if(stopped)return;const height=window.innerHeight;for(const item of active){const r=item.node.getBoundingClientRect();const progress=Math.max(-1,Math.min(1,(height/2-(r.top+r.height/2))/(height/2+r.height/2)));item.node.style.setProperty('--photo-drift',(progress*16).toFixed(2)+'px');}};
 const schedule=()=>{if(!stopped&&!raf)raf=requestAnimationFrame(draw);};
 const watch=new IntersectionObserver(entries=>{for(const entry of entries){const item=photos.find(x=>x.node===entry.target);if(!item)continue;if(entry.isIntersecting)active.add(item);else active.delete(item);}schedule();},{rootMargin:'100px 0px'});

 window.addEventListener('scroll',schedule,{passive:true});window.addEventListener('resize',schedule,{passive:true});
 const showAll=()=>{stopped=true;reveal.disconnect();watch.disconnect();if(raf)cancelAnimationFrame(raf);for(const n of targets)n.classList.add('is-visible');for(const p of photos)p.node.style.setProperty('--photo-drift','0px');window.removeEventListener('scroll',schedule);window.removeEventListener('resize',schedule);};
 preference.addEventListener('change',e=>{if(e.matches)showAll();});window.addEventListener('beforeprint',showAll);
 if(form)form.addEventListener('focusin',()=>form.classList.add('is-visible'));
